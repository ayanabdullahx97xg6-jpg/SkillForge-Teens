<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillForge Teens</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for components -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body class="bg-gray-900 text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        // State to manage which page is currently showing
        const [currentPage, setCurrentPage] = useState('home');

        // Render Courses Page Placeholder
        if (currentPage === 'courses') {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-center p-6">
              <h1 className="text-5xl font-bold text-blue-500 mb-4">Explore Courses</h1>
              <p className="text-xl text-gray-300 mb-8">Our course catalog is under construction. Check back soon!</p>
              <button onClick={() => setCurrentPage('home')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition">
                Return Home
              </button>
            </div>
          );
        }

        // Render Login Page Placeholder
        if (currentPage === 'login') {
           return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-center p-6">
              <h1 className="text-5xl font-bold text-blue-500 mb-4">Login / Sign Up</h1>
              <p className="text-xl text-gray-300 mb-8">The authentication portal will be connected here.</p>
              <button onClick={() => setCurrentPage('home')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition">
                Return Home
              </button>
            </div>
          );
        }

        // Render Main Landing Page
        return (
          <div className="min-h-screen bg-gray-900 text-white flex flex-col">
            {/* Navigation Bar */}
            <nav className="flex justify-between items-center p-6 border-b border-gray-800">
              <div className="text-2xl font-extrabold text-blue-500 tracking-wider">
                SkillForge<span className="text-white">Teens</span>
              </div>
              <div>
                <button onClick={() => setCurrentPage('login')} className="text-gray-300 hover:text-white mr-6 font-semibold transition">Login</button>
                <button onClick={() => setCurrentPage('login')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-md transition shadow-lg shadow-blue-500/20">Sign Up</button>
              </div>
            </nav>

            {/* Hero Section */}
            <main className="flex-grow flex flex-col items-center justify-center text-center py-20 px-6">
              <h1 className="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 mb-6">
                Unlock Your Potential
              </h1>
              <p className="text-xl md:text-2xl text-gray-400 max-w-3xl mb-10 leading-relaxed">
                The ultimate learning platform designed specifically for teens. Master coding, design, and essential tech skills to build your future today.
              </p>
              <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
                <button onClick={() => setCurrentPage('login')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 px-10 rounded-lg shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1">
                  Start Learning Now
                </button>
                <button onClick={() => setCurrentPage('courses')} className="border-2 border-gray-600 hover:bg-gray-800 hover:border-gray-500 text-white font-bold text-lg py-4 px-10 rounded-lg transition">
                  Explore Courses
                </button>
              </div>
            </main>

            {/* Features Section */}
            <section className="py-20 px-6 bg-gray-800 border-t border-gray-700">
              <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                <div className="bg-gray-900 p-8 rounded-2xl border border-gray-700 hover:border-blue-500 transition duration-300 transform hover:-translate-y-2">
                  <div className="text-blue-500 text-4xl mb-6"><i className="fa-solid fa-code"></i></div>
                  <h3 className="text-2xl font-bold mb-3">Code & Build</h3>
                  <p className="text-gray-400 leading-relaxed">Learn web development, app creation, and software engineering from the ground up.</p>
                </div>
                <div className="bg-gray-900 p-8 rounded-2xl border border-gray-700 hover:border-blue-500 transition duration-300 transform hover:-translate-y-2">
                  <div className="text-blue-500 text-4xl mb-6"><i className="fa-solid fa-palette"></i></div>
                  <h3 className="text-2xl font-bold mb-3">Design & Create</h3>
                  <p className="text-gray-400 leading-relaxed">Master UI/UX design, graphic creation, and digital arts to express your creativity.</p>
                </div>
                <div className="bg-gray-900 p-8 rounded-2xl border border-gray-700 hover:border-blue-500 transition duration-300 transform hover:-translate-y-2">
                  <div className="text-blue-500 text-4xl mb-6"><i className="fa-solid fa-rocket"></i></div>
                  <h3 className="text-2xl font-bold mb-3">Future Ready</h3>
                  <p className="text-gray-400 leading-relaxed">Build a real-world portfolio, learn professional skills, and prepare for a career in tech.</p>
                </div>
              </div>
            </section>
            
            {/* Footer */}
            <footer className="text-center py-8 text-gray-500 bg-gray-900">
              <p>&copy; 2026 SkillForge Teens. All rights reserved.</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
